# Community bundle: Tailscale Serve remote access for the existing DSH Web
# application. It does not patch DSH source files and never opens a LAN
# listener; the phone reaches the loopback Web server through `tailscale serve`.
- insert:
    - id: mobile-access
      name: dsh-mobile-tailscale
      inject: [webServer, connection]
      config:
        stateFile: !!js dshHomePath('mobile-access/state.json')
        customCssFile: !!js dshHomePath('mobile-access/mobile.css')
        customScriptFile: !!js dshHomePath('mobile-access/mobile.js')

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Release version gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: npm run check:release-tag

  package:
    name: Plugin package
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
      - run: npm ci
      - run: npm run verify
      - name: Pack plugin and release metadata
        run: |
          npm pack
          sha256sum dsh-mobile-*.tgz > dsh-mobile-plugin.sha256
          npm sbom --sbom-format cyclonedx > dsh-mobile-npm-sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-package
          path: |
            dsh-mobile-*.tgz
            dsh-mobile-plugin.sha256
            dsh-mobile-npm-sbom.cdx.json
          if-no-files-found: error

  publish:
    name: Publish npm package
    needs: package
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: plugin-package
          path: release-assets
      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Read the published name out of the tarball instead of hardcoding it.
          # The idempotence probe used to query `dsh-mobile`, the upstream
          # package, while this package is `dsh-mobile-tailscale`. Upstream has
          # published the same version numbers, so the probe matched, the step
          # reported "already published", and this package was never published —
          # while the GitHub release was still created.
          package="$(find "$GITHUB_WORKSPACE/release-assets" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$package"
          name="$(tar xzOf "$package" package/package.json | node -pe 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')"
          test -n "$name"
          version="${GITHUB_REF_NAME#v}"
          published="$(npm view "$name@$version" version 2>/dev/null || true)"
          if [ "$published" = "$version" ]; then
            echo "$name@$version is already published; leaving the immutable npm release unchanged."
            exit 0
          fi
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish "$package" --access public
          else
            npm publish "$package" --provenance --access public
          fi

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already has a GitHub release; leaving its assets unchanged."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"

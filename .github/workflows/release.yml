name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: Release version gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: npm run check:release-tag

  package:
    name: Plugin package
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
      - run: npm ci
      - run: npm run verify
      - name: Pack plugin and release metadata
        run: |
          npm pack
          sha256sum dsh-mobile-*.tgz > dsh-mobile-plugin.sha256
          npm sbom --sbom-format cyclonedx > dsh-mobile-npm-sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-package
          path: |
            dsh-mobile-*.tgz
            dsh-mobile-plugin.sha256
            dsh-mobile-npm-sbom.cdx.json
          if-no-files-found: error

  android:
    name: Android package
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v6
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          DSH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DSH_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DSH_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 DSH_ANDROID_KEYSTORE_PASSWORD DSH_ANDROID_KEY_ALIAS DSH_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing required Android signing secret: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dsh-mobile-release.jks"
      - name: Test and build signed Android package
        env:
          DSH_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/dsh-mobile-release.jks
          DSH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DSH_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DSH_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon lintDebug testDebugUnitTest assembleRelease -x lintAnalyzeDebugUnitTest -x lintAnalyzeDebugAndroidTest
        working-directory: apps/mobile/android
      - name: Verify Android signature
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose apps/mobile/android/app/build/outputs/apk/release/app-release.apk
      - name: Name Android package
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "dsh-mobile-android-${GITHUB_REF_NAME}.apk"
          sha256sum "dsh-mobile-android-${GITHUB_REF_NAME}.apk" > "dsh-mobile-android-${GITHUB_REF_NAME}.apk.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: android-package
          path: |
            dsh-mobile-android-${{ github.ref_name }}.apk
            dsh-mobile-android-${{ github.ref_name }}.apk.sha256
          if-no-files-found: error

  publish:
    name: Publish npm package
    needs: [package, android]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: plugin-package
          path: release-assets
      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          package="$(find "$GITHUB_WORKSPACE/release-assets" -maxdepth 1 -type f -name 'dsh-mobile-*.tgz' -print -quit)"
          test -n "$package"
          version="${GITHUB_REF_NAME#v}"
          published="$(npm view "dsh-mobile@$version" version 2>/dev/null || true)"
          if [ "$published" = "$version" ]; then
            echo "dsh-mobile@$version is already published; leaving the immutable npm release unchanged."
            exit 0
          fi
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish "$package" --access public
          else
            npm publish "$package" --provenance --access public
          fi

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already has a GitHub release; leaving its assets unchanged."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
